name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mandatory deploy gate (docs/deploy-gate.md): a release is only built
      # from a clean checkout of a commit that is on main and on origin/main.
      # There is no bypass here.
      - name: Deploy gate
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          git branch --force main origin/main
          ./ops/deploy-gate/gate.sh --context "release ${GITHUB_REF_NAME}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELAY_URL: wss://tunnel-connect.openpoet.ai/
