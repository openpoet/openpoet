# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: openpoet

before:
  hooks:
    - go mod tidy

builds:
  - id: openpoet
    main: ./cmd/openpoet
    binary: openpoet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.BuildVersion={{.Version}}
      - -X main.DefaultRelayURL={{ .Env.RELAY_URL }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: openpoet
    name: openpoet
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## OpenPoet v{{.Version}}

    ### Install

    **macOS / Linux (Homebrew):**
    ```bash
    brew install openpoet/tap/openpoet
    ```

    **macOS / Linux (script):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/openpoet/openpoet/main/install.sh | sh
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/openpoet/openpoet/main/install.ps1 | iex
    ```
  footer: |
    ---
    **Full Changelog**: https://github.com/openpoet/openpoet/compare/{{ .PreviousTag }}...{{ .Tag }}

    > OpenPoet is a single binary with no runtime dependencies.

brews:
  - repository:
      owner: openpoet
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/openpoet/openpoet"
    description: "Orchestrate Claude Code sessions across multiple projects"
    license: "MIT"
    install: |
      bin.install "openpoet"
    custom_block: |
      def post_uninstall
        rm_rf "#{Dir.home}/.openpoet"
      end
    caveats: |
      OpenPoet is ready to use! Start it with:
        openpoet

      The web UI will be available at http://localhost:8080
      Data is stored in ~/.openpoet/

      OpenPoet is a single binary with no runtime dependencies.
    test: |
      assert_match version.to_s, shell_output("#{bin}/openpoet version")

